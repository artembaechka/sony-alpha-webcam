[workspace]
resolver = "2"
members = ["crates/sony-ptp", "crates/ptp-wpd", "crates/vcam-shared", "crates/vcam-source", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"


[workspace.dependencies]
sony-ptp = { path = "crates/sony-ptp" }
ptp-wpd = { path = "crates/ptp-wpd" }
vcam-shared = { path = "crates/vcam-shared" }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.62"
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = "thin"

# JPEG decoding and the UI are far too slow unoptimised.
[profile.dev.package."*"]
opt-level = 3
